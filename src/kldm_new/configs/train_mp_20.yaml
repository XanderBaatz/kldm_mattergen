# --------------------------------------------------------------------------- #
# KLDM-New  ·  MP-20  ·  Crystal Structure Prediction
# --------------------------------------------------------------------------- #
# Usage:
#   python -m kldm_new.scripts.train                          # defaults
#   python -m kldm_new.scripts.train trainer.devices=4        # multi-GPU
#   python -m kldm_new.scripts.train +experiment=debug        # quick debug
#   LOG_PATH=/scratch DATA_PATH=/data python -m kldm_new.scripts.train
# --------------------------------------------------------------------------- #

seed: 42
project: "kldm_new"
tags: [ mp_20, csp ]

train: true
test: false
ckpt_path: null

# Paths – override via environment or CLI
log_dir: ${oc.env:LOG_PATH,outputs}
output_dir: ${hydra:runtime.output_dir}
work_dir: ${hydra:runtime.cwd}
data_path: ${oc.env:DATA_PATH,data}/mp_20/processed

# Architecture
hidden_dim: 512
time_dim: 256
num_layers: 6
num_freqs: 128

# Loss
loss_weights:
  vel: 1.0
  cell: 1.0

# Monitoring
monitor_metric: "val/total"
monitor_mode: "min"
val_every_n_epochs: 50

# --------------------------------------------------------------------------- #
#  Data
# --------------------------------------------------------------------------- #
datamodule:
  _target_: kldm_new.scripts._datamodule.KLDMNewDataModule
  data_path: ${data_path}
  train_batch_size: 256
  val_batch_size: 256
  test_batch_size: 256
  num_workers: 1
  pin_memory: true

# --------------------------------------------------------------------------- #
#  Lightning Module
# --------------------------------------------------------------------------- #
lit_module:
  _target_: kldm_new.model.lit_module.LitKLDM

  score_model:
    _target_: kldm_new.model.KLDMScoreModel
    cutoff: 0.5
    max_neighbors: 20
    net:
      _target_: kldm_new.nn.arch.CSPVCellNet
      hidden_dim: ${hidden_dim}
      time_dim: ${time_dim}
      num_layers: ${num_layers}
      h_dim: 100
      num_freqs: ${num_freqs}
      ln: true
      smooth: false
      pred_vel: true
      pred_cell: true
      pred_h: false
      zero_cog: true

  multi_corruption:
    _target_: kldm_new.diffusion.corruption.KLDMMultiCorruption
    pos_sde:
      _target_: kldm_new.diffusion.tdm.KineticLangevinSDE
      scale_pos: 1.0
      tf: 2.0
      k_wn_score: 13
      simplified_parameterization: true
    cell_sde:
      _target_: kldm_new.diffusion.lattice_sde.LatticeVPSDE
      beta_min: 0.1
      beta_max: 20.0
      limit_density: 0.05

  loss_fn:
    _target_: kldm_new.diffusion.loss.KLDMLoss
    weight_vel: ${loss_weights.vel}
    weight_cell: ${loss_weights.cell}

  lr: 5e-4
  with_ema: true
  ema_decay: 0.999
  ema_start: 500
  sampling_N: 1000
  sampling_corrector_steps: 1

# --------------------------------------------------------------------------- #
#  Callbacks
# --------------------------------------------------------------------------- #
callbacks:
  model_checkpoint:
    _target_: pytorch_lightning.callbacks.ModelCheckpoint
    dirpath: ${output_dir}/checkpoints
    filename: "epoch_{epoch:04d}-loss_{val/total:.4f}"
    monitor: ${monitor_metric}
    verbose: false
    save_last: true
    save_top_k: 3
    mode: ${monitor_mode}
    auto_insert_metric_name: false
    save_weights_only: false
    every_n_epochs: ${val_every_n_epochs}
    save_on_train_epoch_end: true

  lr_monitor:
    _target_: pytorch_lightning.callbacks.LearningRateMonitor
    logging_interval: "step"

  rich_progress:
    _target_: pytorch_lightning.callbacks.RichProgressBar

# --------------------------------------------------------------------------- #
#  Logger
# --------------------------------------------------------------------------- #
logger:
  wandb:
    _target_: pytorch_lightning.loggers.wandb.WandbLogger
    save_dir: ${output_dir}
    offline: false
    id: null
    anonymous: null
    project: ${project}
    log_model: false
    prefix: ""
    group: ""
    tags: ${tags}
    job_type: ""
  csv:
    _target_: pytorch_lightning.loggers.CSVLogger
    save_dir: ${output_dir}
    name: "csv/"
    prefix: ""

# --------------------------------------------------------------------------- #
#  Trainer
# --------------------------------------------------------------------------- #
trainer:
  _target_: pytorch_lightning.Trainer
  accelerator: auto
  devices: auto
  strategy: auto
  precision: 32
  max_epochs: -1
  check_val_every_n_epoch: ${val_every_n_epochs}
  num_sanity_val_steps: 0
  gradient_clip_val: 5.0
  gradient_clip_algorithm: "norm"
  accumulate_grad_batches: 1
  deterministic: false
  benchmark: true

# --------------------------------------------------------------------------- #
#  Hydra
# --------------------------------------------------------------------------- #
hydra:
  run:
    dir: ${log_dir}/${project}/runs/${now:%Y-%m-%d}_${now:%H-%M-%S}
  sweep:
    dir: ${log_dir}/${project}/multiruns/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  job:
    chdir: true
