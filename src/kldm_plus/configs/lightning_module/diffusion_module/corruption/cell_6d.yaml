# Original KLDM 6D lattice representation (lengths + angles).
# Lattice SDE: plain VPSDE, no density-normalised limit mean.
# Switch the model to cspv_6d (lattice_dim=6) at the top level.
_target_: kldm_plus.diffusion.corruption.kinetic_multi_corruption.KineticMultiCorruption

kinetic_sde:
  _target_: kldm_plus.diffusion.corruption.sde.KineticLangevinSDE
  scale_pos: 6.283185307179586 # 2π — matches kldm_frnct TDM default
  tf: 2.0
  gamma: 1.0
  k_wn: 13
  n_sigmas: 2000

sdes:
  cell:
    _target_: mattergen.diffusion.corruption.sde_lib.VPSDE
    beta_min: 0.1
    beta_max: 20

discrete_corruptions:
  atomic_numbers:
    _target_: mattergen.diffusion.corruption.d3pm_corruption.D3PMCorruption
    offset: 1
    d3pm:
      _target_: mattergen.diffusion.d3pm.d3pm.MaskDiffusion
      dim: 100
      schedule:
        _target_: mattergen.diffusion.d3pm.d3pm.create_discrete_diffusion_schedule
        kind: standard
        num_steps: 1000
