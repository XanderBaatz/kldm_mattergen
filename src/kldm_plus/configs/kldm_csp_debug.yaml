# Debug config for kldm_csp: 2 train + 2 val steps on CPU, tiny model.
#
# Usage:
#   uv run python -m kldm_plus.train --config-name=kldm_csp_debug
defaults:
  - kldm_csp
  - override data_module: debug_kldm
  - override trainer: debug
  - _self_

lightning_module:
  sampling_N: 10 # fast on CPU; 1000 only for real runs
  diffusion_module:
    model:
      net:
        hidden_dim: 16
        time_dim: 16
        num_layers: 1
        num_freqs: 4
