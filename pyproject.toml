[project]
name = "kldm_new"
version = "0.1.0"
description = "This repository contains configurations to set up a Python development environment using VSCode's Dev Container feature. The environment includes uv and Ruff."

authors = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]
maintainers = [{ name = "a5chin", email = "a5chin.origin+contact@gmail.com" }]

requires-python = ">=3.10,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

dependencies = [
    "beartype>=0.22.9",
    "emmet>=2018.6.7",
    "emmet-core>=0.85.1",
    "google-cloud-logging>=3.13.0",
    "hydra-core>=1.3.2",
    "jaxtyping>=0.3.6",
    "lightning>=2.6.1",
    "mattergen>=1.0.3",
    "numpy>=2.2.6",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "pymatgen>=2025.10.7",
    "torch>=2.10.0",
    "torch-cluster>=1.6.3",
    "torch-geometric>=2.7.0",
    "torch-scatter>=2.1.2",
    "torch-sparse>=0.6.18",
    "wandb>=0.25.1",
]

[dependency-groups]
dev = [
    "cookiecutter>=2.6.0",
    "cookiecutter-data-science>=2.3.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "mkdocs-material>=9.7.1",
    "nox>=2025.11.12",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "sqlfluff>=4.0.0",
    "ty>=0.0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["tools", "src/kldm_new"]

[tool.uv.extra-build-dependencies]
torch-scatter = ["torch"]
torch-sparse = ["torch"]
torch-cluster = ["torch"]

[tool.uv]
dependency-metadata = [{ name = "mattergen", version = "1.0.3" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
