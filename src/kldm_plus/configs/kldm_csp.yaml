# CSP (Crystal Structure Prediction) with KLDM 6D lattice.
# Atom types are fixed inputs — only positions and lattice are diffused.
#
# Usage:
#   uv run python -m kldm_plus.train --config-name=kldm_csp
defaults:
  - default
  - override data_module: mp_20_kldm
  - override trainer: kldm_csp
  - override lightning_module/diffusion_module/corruption: csp_6d
  - override lightning_module/diffusion_module/model: cspv_6d_csp
  - _self_

lightning_module:
  sampling_eval_batches: 4 # run sampling on all 4 val batches
  sampling_N: 1000
  val_metrics:
    _target_: kldm_plus.metrics.csp.CSPMetrics
    stol: 0.5
    angle_tol: 10.0
    ltol: 0.3
    angles_loc: 0.0
    angles_scale: 0.35
  diffusion_module:
    loss_fn:
      kinetic_sde:
        scale_pos: 1.0 # fractional coordinates [0, 1); loss rescales internally via loss_pos_scale=2π
      include_atomic_numbers: false # CSP: no masking loss on atom types
      vocab_size: 100 # still required by the constructor signature
