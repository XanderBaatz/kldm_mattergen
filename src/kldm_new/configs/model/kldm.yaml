_target_: kldm_new.model.lit_module.LitKLDM

score_model:
  _target_: kldm_new.model.KLDMScoreModel
  cutoff: 0.5
  max_neighbors: 20
  graph_mode: radius  # "radius" (scalable) or "full" (original kldm_frnct behaviour, O(N²))
  net:
    _target_: kldm_new.nn.arch.CSPVCellNet
    hidden_dim: ${hidden_dim}
    time_dim: ${time_dim}
    num_layers: ${num_layers}
    h_dim: 100
    num_freqs: ${num_freqs}
    ln: true
    smooth: false
    pred_vel: true
    pred_cell: true
    pred_h: false
    zero_cog: true

multi_corruption:
  _target_: kldm_new.diffusion.corruption.KLDMMultiCorruption
  pos_sde:
    _target_: kldm_new.diffusion.tdm.KineticLangevinSDE
    scale_pos: 1.0
    tf: 2.0
    gamma: 1.0
    # KineticLangevinSDE is the forward process only.
    # Training-target params (k_wn_score, simplified_parameterization)
    # live on loss_fn below.
  cell_sde:
    _target_: kldm_new.diffusion.lattice_sde.LatticeSubVPSDE
    # beta_min / beta_max are forwarded to the default LinearSchedule.
    # To use a different schedule, remove these and add:
    #   schedule:
    #     _target_: kldm_new.diffusion.schedule.CosineSchedule
    #     T: 1.0
    #     s: 0.008
    # or:
    #   schedule:
    #     _target_: kldm_new.diffusion.schedule.SigmoidSchedule
    #     beta_min: 0.1
    #     beta_max: 20.0
    #     start: -3.0
    #     end: 3.0
    beta_min: 0.1
    beta_max: 20.0
    limit_density: 0.05
    limit_var_scaling_constant: 0.25

loss_fn:
  _target_: kldm_new.diffusion.loss.KLDMLoss
  weight_vel: ${loss_weights.vel}
  weight_cell: ${loss_weights.cell}
  # simplified_parameterization: true
  # k_wn_score: 13
  # sigma_norm_table_size: 2000
  # scale_pos: 1.0                   # must match pos_sde.scale_pos

lr: 5e-4
with_ema: true
ema_decay: 0.999
ema_start: 500
sampling_N: 1000
sampling_corrector_steps: 1
# Swap for LogUniformTimestepSampler to over-sample small t.
timestep_sampler:
  _target_: mattergen.diffusion.timestep_samplers.UniformTimestepSampler
  # max_t must not exceed cell_sde.T (1.0). pos_sde.T is 2.0 but the cell SDE
  # saturates at t=1.0, giving no training signal for t>1.0 on the cell branch.
  # Swap _target_ for kldm_new.diffusion.timestep_samplers.LogUniformTimestepSampler
  # to over-sample small t.
  min_t: 1e-3
  max_t: 1.0
