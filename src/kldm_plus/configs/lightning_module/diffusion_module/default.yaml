_target_: kldm_plus.diffusion.diffusion_module.KineticDiffusionModule

# model and corruption are populated by the defaults list in the top-level config.
model: cspv
corruption: cell_3x3

# Sample t ~ Uniform(min_t, 1).  kldm_frnct uses 1e-3; 1e-5 (mattergen default)
# causes sigma_norm → 0 near t=0 which produces huge gradient spikes.
timestep_sampler:
  _target_: mattergen.diffusion.timestep_samplers.UniformTimestepSampler
  min_t: 1.0e-3
  max_t: 1.0

loss_fn:
  _target_: kldm_plus.diffusion.training.loss.KineticLoss
  # kinetic_sde is instantiated separately here so that the loss has access to
  # the physical constants (sigma-norm table, scale_pos, etc.).
  # Keep these parameters in sync with corruption.kinetic_sde.
  kinetic_sde:
    _target_: kldm_plus.diffusion.corruption.sde.KineticLangevinSDE
    scale_pos: 1.0
    tf: 2.0
    gamma: 1.0
    k_wn: 13
    n_sigmas: 2000
  # Maximum number of atom-type classes; matches D3PMCorruption dim.
  vocab_size: 100
  w_pos: 1.0
  w_cell: 1.0
  w_h: 1.0
  simple_loss: false
  reduce: mean
  # kldm_frnct uses x0 for the lattice (parameterization: "x0" in ContinuousDiffusion).
  # score_times_std (= -eps) converges faster in reported MSE; x0 converges to the
  # same quality given enough training.  Both work correctly during sampling.
  cell_model_target: x0
